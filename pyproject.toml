[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "recipe-mcp-portfolio"
version = "1.1.0"
description = "A resilient recipe research and meal planning MCP server"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
  "mcp>=2.2.0,<3",
  "httpx[socks]>=0.28.1,<1",
  "pydantic>=2.13.5,<3",
  "pydantic-settings>=2.15.0,<3",
  "uvicorn>=0.53.0,<1",
]

[project.scripts]
recipe-mcp = "recipe_mcp.__main__:main"

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.16.8,<1",
  "mypy>=2.3.1,<3",
  "respx>=0.23.1,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["recipe_mcp"]

[tool.coverage.run]
source = ["recipe_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
